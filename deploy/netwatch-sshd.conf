# Append this Match block at the end of sshd_config, then verify with sshd -t.
Match User netwatch-tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8787
    AuthenticationMethods publickey
    MaxSessions 0
    AuthorizedKeysCommand /usr/local/libexec/netwatch-authorized-keys %f
    AuthorizedKeysCommandUser netwatch
