server {
    listen 80;
    server_name monitor.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/netwatch-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://monitor.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name monitor.example.com;
    ssl_certificate /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/deploy/(agent-install\.sh|netwatch\.py|netwatch-agent\.service|netwatch-tunnel\.service)$ {
        alias /var/www/netwatch-install/$1;
        default_type application/octet-stream;
    }
    location = /ingest {
        return 404;
    }
    location = /agent-restore {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8787;
    }
    location / {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
    }
}
